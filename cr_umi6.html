<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大当たり制御シミュレーター</title>

  <style>
    :root {
      --bg: #050607;
      --panel: #101417;
      --green: #35ff7a;
      --red: #ff4057;
      --yellow: #ffd84a;
      --blue: #45b7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      color: #e9fff0;
      font-family:
        "Yu Gothic UI",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
      background:
        radial-gradient(circle at center, #14221a 0%, var(--bg) 65%);
      display: grid;
      place-items: center;
    }

    .console {
      width: min(920px, 100%);
      padding: 24px;
      border: 2px solid var(--green);
      border-radius: 16px;
      background: rgba(8, 13, 10, 0.96);
      box-shadow:
        0 0 20px rgba(53, 255, 122, 0.35),
        inset 0 0 35px rgba(53, 255, 122, 0.08);
    }

    h1 {
      margin: 0;
      color: var(--green);
      font-size: clamp(24px, 5vw, 42px);
      letter-spacing: 0.08em;
      text-align: center;
      text-shadow: 0 0 12px rgba(53, 255, 122, 0.8);
    }

    .warning {
      margin: 10px 0 22px;
      color: var(--yellow);
      text-align: center;
      font-weight: bold;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .status-card {
      padding: 15px;
      border: 1px solid #2b5237;
      border-radius: 10px;
      background: var(--panel);
    }

    .status-card span {
      display: block;
      margin-top: 7px;
      color: var(--green);
      font-family: monospace;
      font-size: 18px;
    }

    .meter {
      height: 24px;
      margin-bottom: 18px;
      overflow: hidden;
      border: 1px solid #355f42;
      border-radius: 999px;
      background: #080a09;
    }

    .meter-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(
        90deg,
        var(--green),
        var(--yellow),
        var(--red)
      );
      transition: width 0.25s ease;
    }

    .display {
      min-height: 230px;
      padding: 16px;
      overflow-y: auto;
      border: 1px solid #27733d;
      border-radius: 10px;
      background: #010402;
      color: var(--green);
      font-family: "Courier New", monospace;
      line-height: 1.55;
      box-shadow: inset 0 0 20px rgba(53, 255, 122, 0.1);
    }

    .display div::before {
      content: "> ";
      opacity: 0.7;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    button {
      padding: 16px;
      border: 1px solid var(--green);
      border-radius: 8px;
      color: var(--green);
      background: #102017;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition:
        transform 0.15s,
        background 0.15s,
        box-shadow 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #173522;
      box-shadow: 0 0 12px rgba(53, 255, 122, 0.4);
    }

    button:active {
      transform: translateY(1px);
    }

    .danger {
      border-color: var(--red);
      color: var(--red);
      background: #2a0c11;
    }

    .jackpot {
      animation: jackpotFlash 0.2s infinite alternate;
    }

    @keyframes jackpotFlash {
      from {
        background: #050607;
      }
      to {
        background: #541500;
      }
    }

    @media (max-width: 650px) {
      .status-grid,
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="console">
    <h1>大当たり制御システム</h1>

    <p class="warning">
      ※このTOOLは目の前だけの実機・基板・ホール設備へ接続します。大当たり確率や抽選結果を変更する機能で、
      画面上から遠隔操作が可能です。実在機のROMデータを使用しており画像・音源・は使用していません。
　　　あくまで現時点でのROMであり対策されるまでのものです。

　　　　　　　　　　　　作成者及び著作権利者 よしくん。
    </p>

    <section class="status-grid">
      <div class="status-card">
        端末機ROM
        <span id="terminalStatus">未接続</span>
      </div>

      <div class="status-card">
        偽装抽選値
        <span id="lotteryValue">---</span>
      </div>

      <div class="status-card">
        演出モード
        <span id="modeStatus">通常</span>
      </div>
    </section>

    <div class="meter">
      <div id="meterBar" class="meter-bar"></div>
    </div>

    <section id="display" class="display">
      <div>システム起動完了</div>
      <div>CR海物語6機を確認できません</div>
      <div>外部機器への通信機能：無効</div>
    </section>

    <section class="controls">
      <button id="connectButton">実機端末のROMに接続</button>
      <button id="analyzeButton">抽選データ解析</button>
      <button id="jackpotButton">大当たり演出を実行</button>
      <button id="stopButton" class="danger">緊急停止</button>
    </section>
  </main>

  <script>
    "use strict";

    const display = document.getElementById("display");
    const terminalStatus = document.getElementById("terminalStatus");
    const lotteryValue = document.getElementById("lotteryValue");
    const modeStatus = document.getElementById("modeStatus");
    const meterBar = document.getElementById("meterBar");

    const connectButton = document.getElementById("connectButton");
    const analyzeButton = document.getElementById("analyzeButton");
    const jackpotButton = document.getElementById("jackpotButton");
    const stopButton = document.getElementById("stopButton");

    let runningTask = null;

    function addLog(message) {
      const line = document.createElement("div");
      const now = new Date().toLocaleTimeString("ja-JP");
      line.textContent = `[${now}] ${message}`;

      display.appendChild(line);
      display.scrollTop = display.scrollHeight;
    }

    function sleep(milliseconds) {
      return new Promise((resolve) => {
        runningTask = setTimeout(resolve, milliseconds);
      });
    }

    function randomHex(length = 8) {
      const characters = "0123456789ABCDEF";
      let result = "";

      for (let i = 0; i < length; i += 1) {
        const index = Math.floor(Math.random() * characters.length);
        result += characters[index];
      }

      return result;
    }

    async function fakeConnect() {
      connectButton.disabled = true;
      terminalStatus.textContent = "接続処理中";

      const messages = [
        "インターフェースを初期化",
        "暗号化通信を開始",
        `端末IDを検出：PX-${randomHex(6)}`,
        "セキュリティチェックを通過",
        "接続演出が完了"
      ];

      for (const message of messages) {
        addLog(message);
        await sleep(550);
      }

      terminalStatus.textContent = "接続が完了出来ません";
      connectButton.disabled = false;
    }

    async function fakeAnalyze() {
      analyzeButton.disabled = true;
      modeStatus.textContent = "解析中";

      for (let progress = 0; progress <= 100; progress += 5) {
        meterBar.style.width = `${progress}%`;

        lotteryValue.textContent =
          Math.floor(Math.random() * 65536)
            .toString(16)
            .toUpperCase()
            .padStart(4, "0");

        if (progress % 20 === 0) {
          addLog(`大当たり抽選テーブル解析：${progress}%`);
        }

        await sleep(100);
      }

      addLog("解析完了：大当たりまでの確率を検出");
      modeStatus.textContent = "準備完了";
      analyzeButton.disabled = false;
    }

    async function fakeJackpot() {
      jackpotButton.disabled = true;
      modeStatus.textContent = "大当たり演出";
      document.body.classList.add("jackpot");

      const messages = [
        "大当たりフラグを書き換えています",
        "偽装乱数テーブルを再構成",
        "フィーバー演出を承認",
        "確変モードへ移行",
        "777"
      ];

      for (const message of messages) {
        addLog(message);
        lotteryValue.textContent = randomHex(4);
        meterBar.style.width = `${40 + Math.random() * 60}%`;
        await sleep(650);
      }

      lotteryValue.textContent = "777";
      meterBar.style.width = "100%";

      alert(
        "🎉 大当たり操作成功！\n\nこれはブラウザ上の表示です。"
      );

      document.body.classList.remove("jackpot");
      modeStatus.textContent = "確変成功";
      jackpotButton.disabled = false;
    }

    function emergencyStop() {
      if (runningTask !== null) {
        clearTimeout(runningTask);
        runningTask = null;
      }

      document.body.classList.remove("jackpot");
      terminalStatus.textContent = "停止";
      lotteryValue.textContent = "---";
      modeStatus.textContent = "安全停止";
      meterBar.style.width = "0%";

      connectButton.disabled = false;
      analyzeButton.disabled = false;
      jackpotButton.disabled = false;

      addLog("すべての演出を緊急停止");
    }

    connectButton.addEventListener("click", fakeConnect);
    analyzeButton.addEventListener("click", fakeAnalyze);
    jackpotButton.addEventListener("click", fakeJackpot);
    stopButton.addEventListener("click", emergencyStop);
  </script>
</body>
</html>
